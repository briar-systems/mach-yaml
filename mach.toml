[project]
id = "yaml"
version = "0.1.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "aapcs64"

# the library, what a dependent's `use yaml;` binds
[artifact.yaml]
kind = "static"
default = true
export = true
entry = "lib/yaml.mach"
out = "{project.work}/lib/yaml"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
